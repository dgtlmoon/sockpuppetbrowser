name: Container test

# Builds the image and drives the proxy inside it with a real CDP client, so a change that
# breaks page fetching or leaves temp files behind fails here rather than in production.
#
# Every browser build runs as its own parallel job, because they do not behave the same:
# Chromium 119's old --headless has no ProcessSingleton (so no singleton socket dir) while
# current Chrome's does, and chrome.json's seccomp profile has to work for both musl and glibc.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  container-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whatever Chrome Stable is on the day of the run - catches a new Chrome breaking us
          # before users do.
          - label: chrome-stable
            dockerfile: ./Dockerfile
            chrome-version: current
          # Pinned, so a failure above can be told apart from a failure here.
          - label: chrome-151
            dockerfile: ./Dockerfile
            chrome-version: 151.0.7922.173-1
          # The image sockpuppetbrowser shipped for years, still widely deployed.
          - label: chromium-119
            dockerfile: ./Dockerfile.chromium119
            chrome-version: ''
    uses: ./.github/workflows/container-test-reusable.yml
    with:
      label: ${{ matrix.label }}
      dockerfile: ${{ matrix.dockerfile }}
      chrome-version: ${{ matrix.chrome-version }}
