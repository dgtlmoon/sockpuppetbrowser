version: "3"
services:
  app:
    build:
      context: .
      args:
        # Which Google Chrome to install. "current" tracks whatever Chrome Stable is on the
        # day you build; a deb version like "151.0.7922.173-1" pins it. Google's deb pool
        # only keeps recent releases, so an old pin will 404 the build.
        # Pin this if a Chrome update can break your scraping and you want to choose when to
        # move; leave it on "current" to get security fixes on every rebuild.
        # Whichever you set, `/stats` reports the version actually installed - it asks the
        # browser, so "current" still tells you exactly what you got.
        CHROME_VERSION: "current"
        # Extra Debian packages to bake into the image, space separated. Nothing needs to go
        # here for normal use - the image already ships Noto (CJK, emoji, core) so pages in
        # any script render instead of showing tofu boxes.
        # Read "Fonts and fingerprinting" in the README first: a font set nobody else has is
        # itself a fingerprint, so add whole distro font sets rather than a bespoke handful.
        EXTRA_LINUX_PACKAGES: ""
    # Reap Chrome's orphaned renderers/crashpad/Xvfb processes; the image also runs tini
    # internally, this covers anyone overriding the entrypoint.
    init: true
    cap_add:
      - SYS_ADMIN
    ports:
#      - 192.168.0.1:3000:3000 # ws://...:3000 browser endpoint
#      - 192.168.0.1:8080:8080 # Stats info
      # WARNING! DO NOT USE OPEN PORTS BELOW! ALWAYS BIND TO A LOCAL IP ADDRESS
      - 3000:3000 # ws://...:3000 browser endpoint
      - 8080:8080 # Stats info
    security_opt:
    - seccomp:./chrome.json
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
